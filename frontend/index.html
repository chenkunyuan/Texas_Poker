<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/setup.css">
    <link rel="stylesheet" href="/static/css/game.css">
    <link rel="stylesheet" href="/static/css/results.css">
</head>
<body>
    <div id="app">
        <div id="error-banner" class="error-banner" role="alert" hidden>
            <span id="error-message"></span>
            <button id="btn-dismiss-error" type="button" aria-label="Dismiss error">×</button>
        </div>

        <!-- ============================================================ -->
        <!-- SETUP VIEW                                                   -->
        <!-- ============================================================ -->
        <div id="setup-view" class="view">
            <div class="setup-container">
                <h1 class="setup-title">Texas Hold'em <span class="gold">Poker</span></h1>
                <p class="setup-subtitle">Configure your game</p>

                <div class="setup-columns">
                    <!-- Left Column -->
                    <div class="setup-col">
                        <div class="form-group">
                            <label>Game Mode</label>
                            <div class="toggle-group" data-field="variant">
                                <button class="toggle-btn active" data-value="no_limit">No-Limit</button>
                                <button class="toggle-btn" data-value="pot_limit">Pot-Limit</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>AI Players</label>
                            <div class="stepper" data-field="ai_player_count">
                                <button class="stepper-btn" data-action="down">−</button>
                                <span class="stepper-value">5</span>
                                <button class="stepper-btn" data-action="up">+</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="starting-chips">Starting Chips</label>
                            <input type="number" id="starting-chips" class="form-input" value="1000" min="100" step="100">
                        </div>

                        <div class="form-group">
                            <label>Blinds Mode</label>
                            <div class="toggle-group" data-field="blinds_mode">
                                <button class="toggle-btn active" data-value="fixed">Fixed</button>
                                <button class="toggle-btn" data-value="increasing">Increasing</button>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="setup-col">
                        <div class="form-group blinds-values" id="blinds-fixed-group">
                            <label>Blind Values</label>
                            <div class="inline-inputs">
                                <div class="inline-field">
                                    <span class="field-label">SB</span>
                                    <input type="number" id="sb-value" class="form-input small" value="5" min="1">
                                </div>
                                <div class="inline-field">
                                    <span class="field-label">BB</span>
                                    <input type="number" id="bb-value" class="form-input small" value="10" min="2">
                                </div>
                            </div>
                        </div>

                        <div class="form-group blinds-values" id="blinds-increasing-group">
                            <label>Increasing Blinds</label>
                            <div class="inline-inputs">
                                <div class="inline-field">
                                    <span class="field-label">Init SB</span>
                                    <input type="number" id="inc-sb" class="form-input small" value="5" min="1">
                                </div>
                                <div class="inline-field">
                                    <span class="field-label">Init BB</span>
                                    <input type="number" id="inc-bb" class="form-input small" value="10" min="2">
                                </div>
                            </div>
                            <div class="inline-inputs">
                                <div class="inline-field">
                                    <span class="field-label">Interval</span>
                                    <input type="number" id="inc-interval" class="form-input small" value="10" min="1">
                                </div>
                                <div class="inline-field">
                                    <span class="field-label">Mult</span>
                                    <input type="number" id="inc-multiplier" class="form-input small" value="2.0" min="1.1" step="0.1">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>AI Personality</label>
                            <div class="toggle-group" data-field="personality_mode">
                                <button class="toggle-btn active" data-value="random">Random</button>
                                <button class="toggle-btn" data-value="manual">Manual</button>
                            </div>
                        </div>

                    </div>
                </div>

                <button id="btn-start-game" class="btn-gold">
                    <span class="btn-icon" aria-hidden="true">♠</span><span class="btn-label">Start game</span>
                </button>
                <p id="setup-error" class="error-text" hidden></p>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- GAME VIEW                                                    -->
        <!-- ============================================================ -->
        <section id="game-view" class="view game-view" hidden>
            <header class="game-topbar">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">♠</span>
                    <span>Texas Hold'em</span>
                </div>
                <div class="game-meta">
                    <span>Hand #<b id="hand-number">0</b></span>
                    <span id="phase-display">Waiting</span>
                    <span id="blinds-display">—</span>
                </div>
                <div class="game-tools">
                    <span id="connection-status" role="status" data-status="disconnected">Disconnected</span>
                    <button id="btn-sound" type="button" aria-pressed="false">Sound off</button>
                </div>
            </header>

            <main id="game-stage" class="game-stage">
                <section id="poker-table" class="poker-table" aria-label="Poker table">
                    <div class="table-felt">
                        <div id="pot-label" class="pot-label">Pot 0</div>
                        <div id="community-cards" class="community-cards" aria-label="Community cards"></div>
                        <div id="player-spots"></div>
                    </div>
                </section>

                <aside id="hand-panel" class="floating-panel hand-panel" aria-label="Your hand"></aside>

                <aside id="action-log-panel" class="floating-panel action-log-panel">
                    <header>
                        <h2>Action log</h2>
                        <button id="btn-toggle-log" type="button" aria-expanded="true">Collapse</button>
                    </header>
                    <div id="action-log" aria-live="polite"></div>
                </aside>

                <div id="thinking-indicator" class="thinking-indicator" hidden>
                    <span id="thinking-text"></span>
                </div>
            </main>

            <footer id="action-bar" class="action-dock" aria-label="Poker actions">
                <button id="btn-fold" class="action-button action-fold" data-action="FOLD" type="button" disabled>
                    Fold <kbd>F</kbd>
                </button>
                <button id="btn-check" class="action-button" data-action="CHECK" type="button" disabled>
                    Check <kbd>C</kbd>
                </button>
                <button id="btn-call" class="action-button" data-action="CALL" type="button" disabled>
                    Call <span id="call-amount">0</span> <kbd>A</kbd>
                </button>
                <div class="raise-controls">
                    <div class="raise-field">
                        <label class="sr-only" for="raise-amount">Raise amount</label>
                        <input id="raise-amount" type="number" inputmode="numeric" step="1" aria-describedby="raise-error" disabled>
                        <p id="raise-error" class="raise-error" role="alert" hidden></p>
                    </div>
                    <button class="preset-button" data-fraction="0.5" type="button" disabled>1/2 pot</button>
                    <button class="preset-button" data-fraction="0.75" type="button" disabled>3/4 pot</button>
                    <button class="preset-button" data-fraction="1" type="button" disabled>Pot</button>
                    <button id="btn-raise" class="action-button action-primary" data-action="RAISE" type="button" disabled>
                        Raise <kbd>R</kbd>
                    </button>
                </div>
                <button id="btn-allin" class="action-button action-all-in" data-action="ALL_IN" type="button" disabled>
                    All-in <span id="allin-amount">0</span> <kbd>I</kbd>
                </button>
            </footer>

            <div id="live-announcer" class="sr-only" aria-live="assertive"></div>
        </section>

        <!-- ============================================================ -->
        <!-- RESULTS VIEW                                                 -->
        <!-- ============================================================ -->
        <div id="results-view" class="view" hidden>
            <div class="results-container">
                <div class="results-header">
                    <div class="trophy">🏆</div>
                    <h1 class="results-title">Game Over</h1>
                    <p class="results-subtitle">Total Hands: <span id="total-hands">0</span></p>
                </div>

                <div class="results-columns">
                    <!-- Rankings -->
                    <div class="results-panel rankings-panel">
                        <h2 class="panel-title">Final Rankings</h2>
                        <div id="rankings-list" class="rankings-list">
                            <!-- Dynamically filled -->
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="results-panel stats-panel">
                        <h2 class="panel-title">Statistics</h2>
                        <div id="stats-container" class="stats-container">
                            <!-- Dynamically filled -->
                        </div>
                    </div>
                </div>

                <div class="results-actions">
                    <button id="btn-play-again" class="btn-gold">
                        <span class="btn-icon">♠</span> Play Again
                    </button>
                    <button id="btn-view-replay" class="btn-secondary">
                        <span class="btn-icon">▶</span> View Replay
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
