<h2>🎨 界面设计 — 牌桌布局方案</h2>
<p class="subtitle">德州扑克牌桌的两种布局风格</p>

<div class="options">
  <div class="option" data-choice="top-down" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>俯视牌桌 (经典风格)</h3>
      <p>椭圆形牌桌俯视图，玩家围坐四周，公共牌居中，底池在中央。模拟真实牌桌俯视感，最接近线下扑克体验。</p>
      <div class="mockup" style="margin-top:10px;">
        <div class="mockup-header">布局示意</div>
        <div class="mockup-body">
          <div style="background:#0d5e2e;border-radius:50%;width:260px;height:160px;margin:0 auto;position:relative;border:8px solid #3e2723;">
            <div style="position:absolute;top:8px;left:50%;transform:translateX(-50%);color:white;font-size:10px;">玩家6</div>
            <div style="position:absolute;top:30px;right:15px;color:white;font-size:10px;">玩家5</div>
            <div style="position:absolute;bottom:30px;right:15px;color:white;font-size:10px;">玩家4</div>
            <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#ffd740;font-size:10px;font-weight:bold;">👤 你</div>
            <div style="position:absolute;bottom:30px;left:15px;color:white;font-size:10px;">玩家3</div>
            <div style="position:absolute;top:30px;left:15px;color:white;font-size:10px;">玩家2</div>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;gap:4px;">
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">A♠</span>
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">K♥</span>
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">7♦</span>
            </div>
            <div style="position:absolute;top:57%;left:50%;transform:translate(-50%,10px);color:#ffd740;font-size:9px;">Pot: 350</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="linear" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>线性布局 (现代风格)</h3>
      <p>玩家横向排列，公共牌和底池在屏幕中央上方。布局更紧凑，适合屏幕空间利用，类似在线扑克平台风格。</p>
      <div class="mockup" style="margin-top:10px;">
        <div class="mockup-header">布局示意</div>
        <div class="mockup-body">
          <div style="background:#0d5e2e;border-radius:12px;padding:12px;">
            <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;">
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">A♠</span>
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">K♥</span>
              <span style="background:white;color:black;padding:2px 5px;border-radius:2px;font-size:9px;">7♦</span>
            </div>
            <div style="text-align:center;color:#ffd740;font-size:9px;margin-bottom:6px;">Pot: 350</div>
            <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
              <span style="color:white;font-size:9px;background:#1a1a1a;padding:2px 6px;border-radius:8px;">P1</span>
              <span style="color:#ffd740;font-size:9px;background:#1a1a1a;padding:2px 6px;border-radius:8px;">👤 P2</span>
              <span style="color:white;font-size:9px;background:#1a1a1a;padding:2px 6px;border-radius:8px;">P3</span>
              <span style="color:white;font-size:9px;background:#1a1a1a;padding:2px 6px;border-radius:8px;">P4</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
